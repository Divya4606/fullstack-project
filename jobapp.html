<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Job Tracker - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="jobapp.css">
</head>

<body class="login-page">

    <div class="login-overlay"></div>

    <div class="login-card">

        <div class="logo">
            💼
        </div>

        <h1>Smart Job Tracker</h1>

        <p class="text-muted">
            Track your career journey smarter
        </p>

        <form id="loginForm">

            <div class="mb-3">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Login 🚀
            </button>

        </form>

        <p class="small text-muted mt-3">
            Your job search, organized in one place.
        </p>

    </div>

    <script src="jobapp.js"></script>

</body>
</html>
